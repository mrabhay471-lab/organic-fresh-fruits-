<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Organise Fresh Fruits | Home Delivery</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:#172117;
  background:
    linear-gradient(rgba(248,250,244,.90),rgba(248,250,244,.94)),
    url("https://loremflickr.com/1600/1000/fresh,fruits?lock=77");
  background-size:cover;
  background-attachment:fixed;
}

header{
  min-height:360px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:40px 18px;
  background:
    linear-gradient(rgba(15,55,25,.58),rgba(15,55,25,.48)),
    url("https://loremflickr.com/1600/900/fruit,market?lock=88");
  background-size:cover;
  background-position:center;
  color:white;
}

.hero{
  max-width:700px;
}

.badge{
  display:inline-block;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.4);
  padding:8px 16px;
  border-radius:30px;
  margin-bottom:15px;
  backdrop-filter:blur(8px);
}

h1{
  font-size:42px;
  margin:10px 0;
}

.hero p{
  font-size:18px;
  margin:10px 0 25px;
}

.hero button{
  border:0;
  padding:15px 28px;
  border-radius:30px;
  background:#fff;
  color:#16833b;
  font-size:17px;
  font-weight:800;
}

.info-bar{
  max-width:1100px;
  margin:-30px auto 25px;
  padding:20px;
  background:rgba(255,255,255,.95);
  border-radius:22px;
  box-shadow:0 10px 35px rgba(0,0,0,.12);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  text-align:center;
  position:relative;
}

.info{
  padding:12px;
}

.info b{
  display:block;
  font-size:18px;
  margin-top:5px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.section-title{
  text-align:center;
  margin:30px 0 20px;
}

.section-title h2{
  font-size:30px;
  margin:0 0 7px;
}

.section-title p{
  color:#687068;
}

.fruits{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.fruit{
  background:rgba(255,255,255,.96);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 7px 25px rgba(0,0,0,.10);
  border:1px solid rgba(0,0,0,.06);
}

.fruit img{
  width:100%;
  height:190px;
  object-fit:cover;
  display:block;
}

.fruit-body{
  padding:15px;
}

.fruit-name{
  font-size:20px;
  font-weight:800;
}

.price{
  color:#667066;
  margin:5px 0 13px;
}

.controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:#16833b;
  color:white;
  font-size:25px;
  font-weight:bold;
}

.qty{
  font-size:20px;
  font-weight:800;
}

.order-card{
  margin:35px auto;
  max-width:700px;
  background:rgba(255,255,255,.97);
  padding:25px;
  border-radius:25px;
  box-shadow:0 10px 35px rgba(0,0,0,.12);
}

input,textarea{
  width:100%;
  padding:14px;
  margin:7px 0 15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
}

textarea{
  min-height:90px;
}

.location-box{
  background:#eef8ef;
  padding:15px;
  border-radius:15px;
  margin:10px 0 18px;
}

.location-btn{
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#172117;
  color:white;
  font-weight:700;
  font-size:16px;
}

.distance{
  margin-top:12px;
  line-height:1.7;
}

.summary{
  background:#f6f8f4;
  padding:18px;
  border-radius:15px;
  margin-top:15px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
}

.total{
  border-top:1px solid #ddd;
  padding-top:12px;
  margin-top:12px;
  font-size:22px;
  font-weight:900;
}

.payment{
  margin-top:20px;
  padding:18px;
  background:#fff8df;
  border-radius:16px;
  text-align:center;
}

.upi-btn{
  display:block;
  width:100%;
  padding:15px;
  margin-top:10px;
  background:#16833b;
  color:white;
  border:0;
  border-radius:12px;
  font-size:17px;
  font-weight:800;
}

#qrcode{
  display:flex;
  justify-content:center;
  margin-top:15px;
}

.order-btn{
  width:100%;
  margin-top:20px;
  padding:17px;
  border:0;
  border-radius:14px;
  background:#25D366;
  color:white;
  font-size:19px;
  font-weight:900;
}

.note{
  text-align:center;
  color:#687068;
  font-size:13px;
  margin-top:12px;
}

footer{
  text-align:center;
  padding:35px 15px;
  background:#172117;
  color:white;
  margin-top:40px;
}

@media(max-width:800px){
  .fruits{
    grid-template-columns:repeat(2,1fr);
  }

  .info-bar{
    grid-template-columns:1fr;
    margin:15px;
  }

  h1{
    font-size:34px;
  }
}

@media(max-width:520px){
  .fruits{
    grid-template-columns:1fr;
  }

  .fruit img{
    height:220px;
  }

  .container{
    padding:14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="hero">
    <div class="badge">🍃 Fresh • Healthy • Premium</div>
    <h1>Organise Fresh Fruits</h1>
    <p>Premium fresh fruits delivered to your home.</p>
    <button onclick="document.getElementById('fruits').scrollIntoView({behavior:'smooth'})">
      🛒 Shop Fresh Fruits
    </button>
  </div>
</header>

<div class="info-bar">
  <div class="info">
    🚚
    <b>10 KM Delivery</b>
    Nearby Home Delivery
  </div>

  <div class="info">
    ⚡
    <b>15–20 Minutes</b>
    Estimated Delivery
  </div>

  <div class="info">
    💳
