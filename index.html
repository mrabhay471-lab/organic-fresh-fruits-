<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Organise Fresh Fruits</title>
<style>body{font-family:Arial;background:#f4f7f2;padding:20px;color:#172117}.card{max-width:520px;margin:auto;background:white;border-radius:20px;padding:22px}h1{margin:0 0 5px}.sub{color:#687068;margin-bottom:20px}.fruit{display:flex;justify-content:space-between;align-items:center;border:1px solid #ddd;border-radius:14px;padding:14px;margin:10px 0}.name{font-weight:700;font-size:18px}.price{color:#687068;font-size:14px}.controls{display:flex;align-items:center;gap:10px}.btn{width:38px;height:38px;border:0;border-radius:50%;font-size:22px}.qty{min-width:20px;text-align:center;font-weight:700}label{display:block;font-weight:700;margin-top:15px}input,textarea{width:100%;box-sizing:border-box;padding:13px;margin-top:6px;border:1px solid #ddd;border-radius:10px;font-size:16px}textarea{min-height:80px}.total{font-size:22px;font-weight:800;margin:20px 0}.order{width:100%;padding:15px;border:0;border-radius:12px;background:#16833b;color:white;font-size:18px;font-weight:700}</style></head>
<body><div class="card"><h1>🍎 Organise Fresh Fruits</h1><div class="sub">Fresh fruits delivered to your home</div><div id="fruits"></div>
<label>Your name<input id="name" placeholder="Enter your name"></label><label>Mobile number<input id="mobile" placeholder="Enter mobile number"></label><label>Full delivery address<textarea id="address" placeholder="Enter delivery address"></textarea></label>
<div class="total">Total: ₹<span id="total">0</span></div><button class="order" onclick="placeOrder()">Place Order on WhatsApp</button></div>
<script>
const f=[["Apple",200],["Orange",50],["Papaya",60],["Pomegranate",120],["Guava",70]],q=[0,0,0,0,0],box=document.getElementById("fruits");
f.forEach((x,i)=>box.innerHTML+=`<div class="fruit"><div><div class="name">${x[0]}</div><div class="price">₹${x[1]}/kg</div></div><div class="controls"><button class="btn" onclick="chg(${i},-1)">−</button><span class="qty" id="q${i}">0</span><button class="btn" onclick="chg(${i},1)">+</button></div></div>`);
function chg(i,d){q[i]=Math.max(0,q[i]+d);document.getElementById("q"+i).textContent=q[i];document.getElementById("total").textContent=q.reduce((s,v,j)=>s+v*f[j][1],0)}
function placeOrder(){let n=name.value.trim(),m=mobile.value.trim(),a=address.value.trim(),items=f.map((x,i)=>q[i]?x[0]+": "+q[i]+" kg":null).filter(Boolean).join("\n");if(!n||!m||!a||!items)return alert("Please fill details and select a fruit.");location.href="https://wa.me/919182974520?text="+encodeURIComponent("🍎 Organise Fresh Fruits Order\n\nName: "+n+"\nMobile: "+m+"\nAddress: "+a+"\n\n"+items+"\n\nTotal: ₹"+total.textContent)}
</script></body></html>
