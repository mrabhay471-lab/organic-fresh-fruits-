<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Organise Fresh Fruits</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f2;color:#172117}
.wrap{max-width:560px;margin:auto;padding:16px}.card{background:#fff;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 5px 22px #0001}
h1{margin:0 0 5px;font-size:29px}.sub{color:#687068;margin-bottom:18px}
.fruit{display:flex;justify-content:space-between;align-items:center;border:1px solid #e1e7df;border-radius:15px;padding:13px;margin:9px 0}
.name{font-size:18px;font-weight:700}.price{font-size:14px;color:#687068;margin-top:4px}.controls{display:flex;align-items:center;gap:9px}
.btn{width:38px;height:38px;border:0;border-radius:50%;font-size:22px;background:#e8f0e6}.qty{min-width:22px;text-align:center;font-weight:700}
label{display:block;font-weight:700;margin-top:14px}input,textarea,select{width:100%;padding:13px;border:1px solid #d5ddd3;border-radius:11px;margin-top:6px;font-size:16px;background:#fff}
.total{font-size:21px;font-weight:800;display:flex;justify-content:space-between;margin:18px 0}.order{width:100%;padding:15px;border:0;border-radius:13px;background:#16833b;color:#fff;font-size:18px;font-weight:800}
.note{font-size:12px;color:#687068;text-align:center;margin-top:9px}
</style></head><body><div class="wrap">
<div class="card"><h1>🍎 Organise Fresh Fruits</h1><div class="sub">Fresh fruits delivered to your home</div></div>
<div class="card"><h2>🍉 Today's Available Fruits</h2><div id="fruits"></div></div>
<div class="card"><h2>📍 Delivery Details</h2>
<label>Your name<input id="name" placeholder="Enter your name"></label>
<label>Mobile number<input id="mobile" inputmode="numeric" placeholder="Enter mobile number"></label>
<label>Delivery distance<select id="distance"><option value="">Select delivery distance</option><option value="50">Up to 5 km — ₹50 delivery</option><option value="100">5–10 km — ₹100 delivery</option></select></label>
<label>Full address<textarea id="address" placeholder="House / Flat, street, landmark"></textarea></label>
<label>Payment<select id="payment"><option>Cash on Delivery</option><option>UPI (pay after order confirmation)</option></select></label>
<div class="total"><span>Delivery</span><span>₹<span id="delivery">0</span></span></div>
<div class="total"><span>Grand Total</span><span>₹<span id="grand">0</span></span></div>
<button class="order" onclick="placeOrder()">Place Order on WhatsApp</button>
<div class="note">UPI ID: 9182974520-z3b9-3@ybl</div></div></div>
<script>
const f=[["Apple",200],["Orange",50],["Papaya",60],["Pomegranate",120],["Guava",70]],q=f.map(()=>0);
const box=document.getElementById("fruits");
f.forEach((x,i)=>box.innerHTML+=`<div class="fruit"><div><div class="name">${x[0]}</div><div class="price">₹${x[1]}/kg</div></div><div class="controls"><button class="btn" onclick="chg(${i},-1)">−</button><span class="qty" id="q${i}">0</span><button class="btn" onclick="chg(${i},1)">+</button></div></div>`);
function subtotal(){return q.reduce((s,v,i)=>s+v*f[i][1],0)}
function chg(i,d){q[i]=Math.max(0,q[i]+d);document.getElementById("q"+i).textContent=q[i];calc()}
function calc(){let s=subtotal(),d=Number(document.getElementById("distance").value)||0;document.getElementById("delivery").textContent=d;document.getElementById("grand").textContent=s+d}
document.getElementById("distance").onchange=calc;
function placeOrder(){let n=name.value.trim(),m=mobile.value.trim(),a=address.value.trim(),d=Number(distance.value),p=payment.value,items=f.map((x,i)=>q[i]?`${x[0]}: ${q[i]} kg = ₹${q[i]*x[1]}`:null).filter(Boolean).join("\n");if(!n||!m||!a||!d||!items)return alert("Please fill all details and select at least one fruit.");let msg=`🍎 Organise Fresh Fruits Order\n\nName: ${n}\nMobile: ${m}\nDelivery: ₹${d}\nAddress: ${a}\nPayment: ${p}\n\n${items}\n\nGrand Total: ₹${document.getElementById("grand").textContent}`;location.href="https://wa.me/919182974520?text="+encodeURIComponent(msg)}
</script></body></html>
